name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable (if present)
        run: chmod +x ./gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.0'

      - name: Install tools (wget, unzip) and download Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          GRADLE_VERSION=7.6
          wget https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O gradle.zip
          sudo unzip -d /opt/gradle gradle.zip
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          gradle --version || true

      - name: Generate or update Gradle wrapper to modern version
        run: |
          GRADLE_BIN=/opt/gradle/gradle-7.6/bin/gradle
          if [ -f "$GRADLE_BIN" ]; then
            # Use the downloaded gradle to create/update wrapper to a modern version
            $GRADLE_BIN wrapper --gradle-version 7.6 || true
          fi
          chmod +x ./gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/**/*.apk
